name: Atualizar publicações do DOU

on:
  schedule:
    - cron: "0 11 * * 1-5"   # 08:00 em Brasília: edição ordinária
    - cron: "0 17 * * 1-5"   # 14:00 em Brasília: pega edições extras
  workflow_dispatch:
    inputs:
      dias:
        description: "Quantos dias reprocessar (use 30 para o primeiro preenchimento)"
        default: "3"

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Coletar atos no INLABS
        env:
          INLABS_EMAIL: ${{ secrets.INLABS_EMAIL }}
          INLABS_SENHA: ${{ secrets.INLABS_SENHA }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scripts/coletar.py --dias "${{ inputs.dias || '3' }}"

      - name: Salvar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dados.json docs/feed.xml
          if git diff --staged --quiet; then
            echo "Sem novidades."
          else
            git commit -m "Atualiza publicações do DOU ($(date +%F))"
            git push
          fi
